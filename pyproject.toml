[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harnesslab"
version = "0.1.0"
description = "Declare harness variants as YAML, run LangGraph A/B experiments, score with LangSmith."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langsmith>=0.2",
    "agentevals",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
harnesslab = "harnesslab.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["harnesslab", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
