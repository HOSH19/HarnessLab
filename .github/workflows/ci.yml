name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q

  compare:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run harness compare
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGSMITH_TRACING: "false"
        run: |
          harnesslab compare examples/ticket_triage \
            --task T-011 \
            --local \
            --output report.html

      - name: Upload compare report
        uses: actions/upload-artifact@v5
        with:
          name: compare-report
          path: report.html
